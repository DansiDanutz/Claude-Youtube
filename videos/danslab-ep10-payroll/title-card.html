<meta charset="utf-8">
<title>EP10 · The Payroll — title card</title>
<style>
  :root{
    --void:#040404;--gold:#d4a017;--coral:#c9584a;--bone:#fff;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);height:100vh;display:grid;place-items:center;overflow:hidden}
  /* starfield, matched to the ep01-09 plates */
  body::before{
    content:"";position:fixed;inset:0;opacity:.55;
    background-image:
      radial-gradient(1px 1px at 9% 18%,#fff,transparent),
      radial-gradient(1px 1px at 71% 12%,#e8ded0,transparent),
      radial-gradient(1px 1px at 31% 74%,#fff,transparent),
      radial-gradient(1px 1px at 86% 61%,#d8cfc0,transparent),
      radial-gradient(1px 1px at 48% 39%,#fff,transparent),
      radial-gradient(1px 1px at 94% 30%,#fff,transparent),
      radial-gradient(1px 1px at 19% 91%,#cfc6b8,transparent),
      radial-gradient(1px 1px at 62% 84%,#fff,transparent),
      radial-gradient(1px 1px at 41% 8%,#e0d7c8,transparent);
  }
  /* vignette */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 60% at 50% 50%,transparent 40%,rgba(0,0,0,.75) 100%);
  }
  .plate{position:relative;z-index:2;text-align:center}
  .kick{
    font-family:var(--mono);font-size:clamp(9px,.86vw,14px);letter-spacing:.52em;
    color:var(--coral);text-transform:uppercase;margin-bottom:.85em;
    opacity:0;animation:fade 1100ms var(--ease) 200ms forwards;
  }
  h1{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(48px,7.2vw,132px);line-height:1;letter-spacing:-.015em;
    color:var(--bone);
    opacity:0;animation:rise 1300ms var(--ease) 480ms forwards;
  }
  h1 em{font-style:italic;color:var(--gold)}
  .rule{
    width:min(26vw,360px);height:2px;margin:clamp(16px,1.9vw,36px) auto 0;
    background:linear-gradient(90deg,transparent,rgba(212,160,23,.55) 18%,var(--gold) 45%,var(--gold) 55%,rgba(212,160,23,.55) 82%,transparent);
    transform:scaleX(0);transform-origin:center;
    animation:draw 1200ms var(--ease) 1000ms forwards;
  }
  .sub{
    font-family:var(--mono);font-size:clamp(8px,.72vw,12px);letter-spacing:.34em;
    color:#6b655c;text-transform:uppercase;margin-top:1.5em;
    opacity:0;animation:fade 1100ms var(--ease) 1500ms forwards;
  }
  @keyframes fade{to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes draw{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){
    .kick,h1,.sub{opacity:1;animation:none}.rule{transform:scaleX(1);animation:none}
  }
</style>
<div class="plate">
  <div class="kick">Danslab · No. 10 · Special</div>
  <h1>The <em>Payroll</em></h1>
  <div class="rule"></div>
  <div class="sub">what eight workers actually cost</div>
</div>
